<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111c2e"><title>Abrir painel Reserva</title><style>html,body{margin:0;background:#111c2e;color:#f3f6ff;font-family:Arial,sans-serif}main{max-width:420px;margin:24px auto;padding:18px}h1{font-size:24px;margin:0 0 10px}p{color:#a6b6cd;font-size:14px;line-height:1.4}label{display:block;margin:18px 0 8px}input,button{box-sizing:border-box;width:100%;font-size:20px;padding:12px;border-radius:8px;border:1px solid #a7b7ff}input{background:#19283e;color:white;letter-spacing:4px}button{margin-top:12px;background:#a7b7ff;color:#111c2e;font-weight:bold}</style></head><body><main><h1>Reserva</h1><p>Digite o código de acesso informado na conversa para abrir seu painel.</p><form action="/entrar" method="post"><label for="codigo">Código de acesso</label><input id="codigo" name="codigo" type="text" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="off" required><button type="submit">Abrir painel</button></form><p>Depois que os números aparecerem, use Compartilhar → Adicionar à Tela de Início.</p></main></body></html>
